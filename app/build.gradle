plugins {
    id 'com.android.application'
}

android {
    namespace 'app.orbitvpn.client'
    compileSdk 34

    defaultConfig {
        applicationId "app.orbitvpn.client"
        minSdk 21
        targetSdk 34
        versionCode 12
        versionName "1.0.0"
        setProperty("archivesBaseName", "OrbitVPN-" + versionName)
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation project(path: ':v2ray')
}